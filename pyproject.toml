[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-canary"
version = "0.1.0"
description = "Runtime security tester for MCP servers: rug-pull, tool-poisoning, exfiltration and SSRF probes against live servers, not their config"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gavin Blacklock" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-security",
    "llm-security",
    "tool-poisoning",
    "security-testing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
mcpcanary = "mcpcanary.cli:main"

[project.urls]
Homepage = "https://github.com/Epsilon0xCell/mcp-canary"
Issues = "https://github.com/Epsilon0xCell/mcp-canary/issues"

[tool.setuptools.packages.find]
where = ["src"]
